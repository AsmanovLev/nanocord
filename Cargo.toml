[package]
name = "nanocord"
version = "0.2.2"
edition = "2024"

[lib]
name = "nanocord"
path = "src/lib.rs"

[[bin]]
name = "nanocord"
path = "src/main.rs"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_UI_Shell_PropertiesSystem"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
winit = { version = "0.30", default-features = true }
glutin = { version = "0.32", features = ["wgl"] }
glutin-winit = { version = "0.5", features = ["wgl"] }
image = "0.25"
nokhwa = { version = "0.10.11", features = ["input-native"] }
opus-pure = "0.2.2"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# A panic in a worker thread must not take the whole call down. With `abort`
# one failed DXGI/VENC/audio call kills the process mid-conversation.
panic = "unwind"
strip = true

[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
