[package]
name = "nanocord"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_Foundation"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
winit = { version = "0.30", default-features = true }
glutin = { version = "0.32", features = ["wgl"] }
glutin-winit = { version = "0.5", features = ["wgl"] }
image = "0.25"
nokhwa = { version = "0.10.11", features = ["input-native"] }
